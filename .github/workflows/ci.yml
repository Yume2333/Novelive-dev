name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks and Electron smoke
    runs-on: ubuntu-24.04
    env:
      NL_REPLAY: strict
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils xvfb xauth libgtk-3-0t64 libasound2t64 libnss3 libgbm1 mesa-vulkan-drivers
      - name: Install patchelf 0.19.3
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/NixOS/patchelf/releases/download/0.19.3/patchelf-0.19.3-x86_64.tar.gz \
            --output "$RUNNER_TEMP/patchelf.tar.gz"
          echo "38861b171079e440b25ac86483284f690d0ee7921dba98b0c8fe04a9b0a11667  $RUNNER_TEMP/patchelf.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/patchelf.tar.gz" -C "$RUNNER_TEMP" ./bin/patchelf
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          node -e "require('electron')"
      - run: pnpm check
      - name: Run Electron SQLite, sharp, player, production UI and TXT import under Xvfb
        run: xvfb-run -a pnpm test:e2e --grep 'renders the empty library and connects to a real creator|M1b fixed scene|M1b creation surfaces|M1b TXT wizard reviews findings|M2 revise a work'
