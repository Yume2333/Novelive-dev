name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks and Electron smoke
    runs-on: ubuntu-24.04
    env:
      NL_REPLAY: strict
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils patchelf xvfb xauth libgtk-3-0t64 libasound2t64 libnss3 libgbm1
      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          node -e "require('electron')"
      - run: pnpm check
      - name: Run Electron SQLite and sharp smoke under Xvfb
        run: xvfb-run -a pnpm test:e2e --grep 'renders the empty library and connects to a real creator'
