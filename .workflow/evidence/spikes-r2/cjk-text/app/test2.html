<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#1a1d24;overflow:hidden}
.boxwrap{position:absolute;left:6%;right:6%;bottom:6%;
  background:rgba(16,24,33,.82);border:1px solid rgba(148,180,209,.35);border-radius:12px;
  padding:1.2em 1.6em;font-family:'Noto Serif CJK SC','Noto Sans CJK SC',serif;color:#e8eef4;
  font-size:28px;line-height:1.9;line-break:strict;word-break:break-word;
  text-spacing-trim:space-first;text-autospace:normal;
  text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 6px rgba(0,0,0,.5);}
.ghost{visibility:hidden;}
.live{position:absolute;left:1.6em;right:1.6em;top:1.2em;bottom:1.2em;
  font-family:inherit;font-size:inherit;line-height:inherit;color:#e8eef4;
  line-break:strict;word-break:break-word;text-spacing-trim:space-first;text-autospace:normal;
  text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 6px rgba(0,0,0,.5);}
.live .c{opacity:0}.live .c.on{opacity:1}
rt{font-size:.48em;color:#9fc4e8}
</style></head><body>
<div class="boxwrap"><div class="ghost" id="g"></div><div class="live" id="l"></div></div>
<div id="ready" hidden></div>
<script>
const segs=[...new Intl.Segmenter('zh',{granularity:'grapheme'}).segment(window.TEXT||'')]
</script>
<script type="module">
const TEXT='他说：“我一直在等你。”{ruby}——不，等等，让我想想。{ruby}天都快亮了，窗外的蝉还在叫。{pinyin 蝉}蝉{/pinyin}鸣声里，她最后看了他一眼。';
document.getElementById('g').innerHTML=TEXT.replace('{pinyin 蝉}蝉{/pinyin}','<ruby>蝉<rt>chán</rt></ruby>').replace('{ruby}','').replaceAll('{ruby}','');
const LIVE='他说：“我一直在<em style="color:#ffd166">等你</em>。”——不，等等，让我想想。天都快亮了，窗外的蝉还在叫。<ruby>蝉<rt>chán</rt></ruby>鸣声里，她最后看了他一眼。';
document.getElementById('g').innerHTML=LIVE.replace(/<em[^>]*>|<\/em>/g,'');
const l=document.getElementById('l');
// naive per-grapheme: wrap each char (skip inside tags)
let html='';let inTag=false;
for(const ch of LIVE){
  if(ch==='<'){inTag=true;html+=ch;continue}
  if(ch==='>'){inTag=false;html+=ch;continue}
  if(inTag){html+=ch;continue}
  html+=`<span class="c">${ch}</span>`;
}
l.innerHTML=html;
const spans=[...l.querySelectorAll('.c')];let i=0;
window.step=()=>{if(i<spans.length)spans[i++].classList.add('on');};
window.stepN=(n)=>{for(let k=0;k<n;k++)window.step();};
window.all=()=>spans.forEach(s=>s.classList.add('on'));
document.getElementById('ready').textContent='1';
</script></body></html>
