<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novelive R3 Player Demo</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #000; overflow: hidden; }
      .vn-text {
        line-break: strict;
        word-break: break-word;
        text-spacing-trim: space-first;
        text-autospace: normal;
        text-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 6px rgba(0,0,0,.5);
      }
      .ghost { visibility: hidden; }
      ruby rt { font-size: .55em; }
      @keyframes nl-shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-9px,4px)} 40%{transform:translate(8px,-5px)} 60%{transform:translate(-6px,-3px)} 80%{transform:translate(5px,4px)} }
      .shaking { animation: nl-shake .45s linear; }
      .qbtn { background: rgba(20,24,30,.55); border: 1px solid rgba(255,255,255,.14); color: #cfd6de; border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer; backdrop-filter: blur(6px); }
      .qbtn.on { color: #ffd98a; border-color: #ffd98a66; }
      .qbtn:hover { background: rgba(60,70,84,.7); }
      .mark-b { font-weight: 700; }
      .mark-em { color: #ffd98a; font-weight: 600; }
      .mark-dim { opacity: .5; }
      .mark-whisper { opacity: .6; font-size: .85em; }
      .mark-shout { font-weight: 800; font-size: 1.18em; letter-spacing: .05em; }
      .mark-hl { background: linear-gradient(transparent 62%, #ffd98a55 62%, #ffd98a55 92%, transparent 92%); padding: 0 1px; }
      .mark-glitch { display: inline-block; animation: nl-shake .3s linear infinite; color: #a5f0ff; }
      .screen { position: absolute; inset: 0; z-index: 60; background: rgba(6,9,13,.9); backdrop-filter: blur(14px); overflow: auto; padding: 48px 8%; color: #dfe5ec; font-family: 'Noto Sans SC', sans-serif; }
      .backlog-item { padding: 8px 12px; border-bottom: 1px solid #ffffff12; cursor: pointer; }
      .backlog-item:hover { background: #ffffff10; }
      .save-card { border: 1px solid #ffffff22; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; cursor: pointer; background: #ffffff08; }
      .save-card:hover { border-color: #ffd98a88; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
